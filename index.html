<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberSafe Pro v6.3</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>">
    <style>
        :root { --bg: #0f0c29; --card: rgba(36, 36, 62, 0.8); --text: #00d2ff; --input: rgba(26, 26, 46, 0.8); --border: rgba(48, 43, 99, 0.5); }
        .light-mode { --bg: #e0e5ec; --card: rgba(255, 255, 255, 0.7); --text: #2c3e50; --input: rgba(236, 240, 241, 0.8); --border: rgba(189, 195, 199, 0.5); }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; transition: 0.3s; margin: 0; display: flex; justify-content: center; padding: 20px; min-height: 100vh; background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0f0c29 100%); }
        .container { background: var(--card); backdrop-filter: blur(15px); padding: 25px; border-radius: 24px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); width: 100%; max-width: 600px; border: 1px solid var(--border); }
        .top-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .lang-btn { background: var(--input); border: 1px solid var(--text); color: var(--text); padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 10px; font-weight: bold; }
        .pass-wrapper { position: relative; width: 100%; }
        .toggle-pass { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; z-index: 10; font-size: 18px; filter: grayscale(1); }
        .strength-container { height: 4px; width: 100%; background: rgba(0,0,0,0.2); border-radius: 2px; margin: 5px 0 15px 0; overflow: hidden; }
        #pass-strength { height: 100%; width: 0%; transition: 0.5s; }
        .time-lock-section { background: rgba(0, 210, 255, 0.05); border: 1px dashed var(--border); padding: 12px; border-radius: 12px; margin: 10px 0; display: flex; align-items: center; justify-content: space-between; }
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #4ecca3; }
        input:checked + .slider:before { transform: translateX(20px); }
        input, textarea, select { width: 100%; background: var(--input); border: 1px solid var(--border); color: var(--text); padding: 14px; border-radius: 12px; margin: 8px 0; box-sizing: border-box; font-size: 16px; outline: none; }
        .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
        button:not(.btn-copy):not(.lang-btn) { flex: 1 1 140px; padding: 15px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: 0.3s; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%); color: white; }
        .btn-secondary { background: linear-gradient(135deg, #9d50bb 0%, #6e48aa 100%); color: white; }
        .btn-share { background: #4ecca3; color: #1a1a2e; flex: 1 1 100% !important; }
        #ui-btn-save { flex: 1 1 100% !important; background: #ff9a9e; color: #1a1a2e; display: none; margin-top: 5px; }
        .btn-copy { background: rgba(0, 210, 255, 0.1); border: 1px solid var(--text); color: var(--text); font-size: 10px; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
        #status { margin-top: 20px; padding: 12px; border-radius: 12px; text-align: center; font-size: 13px; background: var(--input); border: 1px solid var(--border); }
        #recovery-box { background: rgba(255, 75, 43, 0.9); color: white; padding: 15px; border-radius: 12px; margin: 15px 0; display: none; border-left: 5px solid #fff; }
        .info-bar { display: flex; justify-content: space-between; align-items: center; font-size: 11px; margin-top: 2px; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-controls">
        <div onclick="toggleTheme()" style="cursor:pointer; font-size: 24px;">🌓</div>
        <div class="lang-switcher">
            <button class="lang-btn" onclick="changeLanguage('uz')">UZ</button>
            <button class="lang-btn" onclick="changeLanguage('ru')">RU</button>
            <button class="lang-btn" onclick="changeLanguage('en')">EN</button>
        </div>
    </div>

    <h1 id="ui-title" style="text-align:center;">🔐 CyberSafe Pro</h1>
    
    <div class="pass-wrapper">
        <input type="password" id="key" placeholder="Parol" oninput="checkStrength(this.value)">
        <span class="toggle-pass" onclick="togglePasswordVisibility()">👁️</span>
    </div>
    <div class="strength-container"><div id="pass-strength"></div></div>
    
    <div class="time-lock-section">
        <div style="display: flex; align-items: center; gap: 10px;">
            <label class="switch">
                <input type="checkbox" id="timer-toggle">
                <span class="slider"></span>
            </label>
            <span id="ui-timer-label" style="font-size: 13px;">Vaqtli cheklov:</span>
        </div>
        <select id="expiry-time" style="width: auto; padding: 5px; margin: 0; font-size: 12px;">
            <option value="1">1 Min</option>
            <option value="10">10 Min</option>
            <option value="60">1 Soat</option>
            <option value="1440">24 Soat</option>
        </select>
    </div>

    <div id="recovery-box">
        <strong id="ui-mrk-label">MASTER KEY:</strong><br>
        <span id="mrk-display" style="font-family: monospace; font-size: 14px;"></span>
        <div style="text-align: right; margin-top: 5px;">
            <button class="btn-copy ui-copy-btn" onclick="copyText('mrk-display')">📋 Nusxalash</button>
        </div>
    </div>

    <textarea id="message" rows="4" placeholder="Xabarni yozing..." oninput="updateStats(this.value)"></textarea>
    <div class="info-bar">
        <span id="char-count">Belgilar: 0</span>
        <button class="btn-copy ui-copy-btn" onclick="copyText('message')">📋 Nusxalash</button>
    </div>
    
    <div class="btn-group">
        <select id="format">
            <option value=".txt">TXT File</option>
            <option value=".jpg">JPG Image</option>
            <option value=".pdf">PDF Document</option>
        </select>
        <button id="ui-btn-new" class="btn-primary" py-click="create_action">🆕 Yangi Fayl</button>
        <button id="ui-btn-open" class="btn-secondary" py-click="open_action">📁 Ochish</button>
        <button id="ui-btn-save" py-click="save_action">💾 Saqlash</button>
        <button id="ui-btn-share" class="btn-share" onclick="shareVault()">📤 Ulashish</button>
    </div>
    <div id="status">...</div>
</div>

<script>
    window.currentLang = 'uz';
    window.lastBlob = null;
    window.lastName = "";
    window.currentFileHandle = null;

    const translations = {
        uz: { title: "🔐 CyberSafe Pro", key_ph: "Parol", msg_ph: "Xabarni yozing...", btn_new: "🆕 Yangi Fayl", btn_open: "📁 Ochish", btn_save: "💾 Saqlash", btn_share: "📤 Ulashish", btn_copy: "📋 Nusxalash", timer_lbl: "Vaqtli cheklov:", char_lbl: "Belgilar: ", status_ready: "✅ Tayyor.", status_expired: "⌛ Fayl muddati tugagan!", status_err: "❌ Parol xato!", status_saved: "✅ Saqlandi!", status_copied: "📋 Nusxalandi!", alert_share: "Avval yangi fayl yarating!", mobile_save: "✅ Yangi fayl sifatida saqlandi (Mobil)" },
        ru: { title: "🔐 CyberSafe Pro", key_ph: "Пароль", msg_ph: "Введите сообщение...", btn_new: "🆕 Новый файл", btn_open: "📁 Открыть", btn_save: "💾 Сохранить", btn_share: "📤 Поделиться", btn_copy: "📋 Копировать", timer_lbl: "Лимит времени:", char_lbl: "Символы: ", status_ready: "✅ Готово.", status_expired: "⌛ Срок действия истек!", status_err: "❌ Ошибка пароля!", status_saved: "✅ Сохранено!", status_copied: "📋 Скопировано!", alert_share: "Сначала создайте новый файл!", mobile_save: "✅ Сохранено как новый файл (Моб)" },
        en: { title: "🔐 CyberSafe Pro", key_ph: "Password", msg_ph: "Type message...", btn_new: "🆕 New File", btn_open: "📁 Open", btn_save: "💾 Save Changes", btn_share: "📤 Share Vault", btn_copy: "📋 Copy", timer_lbl: "Time Limit:", char_lbl: "Chars: ", status_ready: "✅ Ready.", status_expired: "⌛ File expired!", status_err: "❌ Password Error!", status_saved: "✅ Saved!", status_copied: "📋 Copied!", alert_share: "Create a new file first!", mobile_save: "✅ Saved as new file (Mobile)" }
    };

    function changeLanguage(lang) {
        window.currentLang = lang; const t = translations[lang];
        document.getElementById('ui-title').innerText = t.title;
        document.getElementById('key').placeholder = t.key_ph;
        document.getElementById('message').placeholder = t.msg_ph;
        document.getElementById('ui-btn-new').innerText = t.btn_new;
        document.getElementById('ui-btn-open').innerText = t.btn_open;
        document.getElementById('ui-btn-save').innerText = t.btn_save;
        document.getElementById('ui-btn-share').innerText = t.btn_share;
        document.getElementById('ui-timer-label').innerText = t.timer_lbl;
        document.querySelectorAll('.ui-copy-btn').forEach(btn => btn.innerText = t.btn_copy);
        updateStatus('status_ready'); // Mana shu joyda status yangilanadi
        updateStats(document.getElementById('message').value);
    }

    // Statusni yangilash uchun universal funksiya
    window.updateStatus = (key) => {
        const msg = translations[window.currentLang][key] || key;
        document.getElementById('status').innerText = msg;
    };

    window.getTranslation = (key) => translations[window.currentLang][key];

    function togglePasswordVisibility() {
        const k = document.getElementById('key');
        k.type = k.type === 'password' ? 'text' : 'password';
    }

    function checkStrength(p) {
        let s = Math.min(p.length * 10, 100);
        const bar = document.getElementById('pass-strength');
        bar.style.width = s + "%";
        bar.style.backgroundColor = s < 40 ? "#ff4b2b" : s < 80 ? "#ffa500" : "#4ecca3";
    }

    function updateStats(val) {
        document.getElementById('char-count').innerText = translations[window.currentLang].char_lbl + val.length;
    }

    async function shareVault() {
        if (!window.lastBlob) { alert(translations[window.currentLang].alert_share); return; }
        const file = new File([window.lastBlob], window.lastName, { type: "text/plain" });
        if (navigator.share) { try { await navigator.share({ files: [file], title: 'Secure Vault', text: 'CyberSafe' }); } catch(e) {} }
    }

    function copyText(id) {
        const el = document.getElementById(id);
        navigator.clipboard.writeText(el.value || el.innerText).then(() => {
            const oldText = document.getElementById('status').innerText;
            window.updateStatus('status_copied');
            setTimeout(() => document.getElementById('status').innerText = oldText, 1500);
        });
    }

    function toggleTheme() { document.body.classList.toggle('light-mode'); }
    
    // Sahifa yuklanganda statusni birinchi marta o'rnatish
    window.onload = () => changeLanguage('uz');
</script>

<script type="py">
import base64, hashlib, datetime, time, random
from pyscript import document
from js import window, Object

SALT = "ULTIMATE_V6.3_FIXED"
MAGIC_FOOTER = "::SAFE_VAULT_OK::"

def get_crypto_tools(key_s):
    kh = hashlib.sha256(key_s.encode('utf-8')).digest()
    if "-" in key_s: mrk = key_s
    else:
        m = hashlib.sha256((key_s + SALT).encode('utf-8')).hexdigest()[:12].upper()
        mrk = "-".join(m[i:i+4] for i in range(0, 12, 4))
        kh = hashlib.sha256(mrk.encode('utf-8')).digest()
    s = list(range(256)); random.seed(int.from_bytes(kh, 'big')); random.shuffle(s)
    inv = [0] * 256
    for i, v in enumerate(s): inv[v] = i
    return s, inv, kh[0], mrk

async def create_action(e):
    k, m = document.querySelector("#key").value, document.querySelector("#message").value
    if not k or not m: return
    
    header = "NO_TIMER"
    if document.querySelector("#timer-toggle").checked:
        minutes = int(document.querySelector("#expiry-time").value)
        header = f"EXPIRE:{int(time.time()) + (minutes * 60)}"
    
    signed_data = f"{header}|{m}{MAGIC_FOOTER}"
    s, _, sh, mrk = get_crypto_tools(k)
    document.querySelector("#mrk-display").innerText = mrk
    document.querySelector("#recovery-box").style.display = "block"
    
    d = signed_data.encode('utf-8'); p = 16 - (len(d) % 16); d += bytes([p] * p)
    b64 = base64.b64encode(bytes([s[b ^ sh] for b in d])).decode('utf-8')
    
    name = f"Vault_{int(time.time())}" + document.querySelector("#format").value
    blob = window.Blob.new([b64]); window.lastBlob = blob; window.lastName = name
    link = document.createElement('a'); link.href = window.URL.createObjectURL(blob); link.download = name; link.click()

async def open_action(e):
    k = document.querySelector("#key").value
    if not k: return
    try:
        h = await window.showOpenFilePicker(Object.fromEntries([["multiple", False]]))
        window.currentFileHandle = h[0]
        f_obj = await window.currentFileHandle.getFile()
        txt = await f_obj.text()
        
        _, inv, sh, _ = get_crypto_tools(k)
        raw = base64.b64decode(txt.strip())
        db = bytes([inv[b] ^ sh for b in raw])
        
        try: dec_full = db[:-db[-1]].decode('utf-8')
        except: raise Exception()
        
        if MAGIC_FOOTER in dec_full:
            content = dec_full.replace(MAGIC_FOOTER, "")
            header, real_msg = content.split("|", 1)
            
            if header.startswith("EXPIRE:"):
                exp_ts = int(header.split(":")[1])
                if int(time.time()) > exp_ts:
                    window.updateStatus('status_expired')
                    document.querySelector("#message").value = ""
                    return

            document.querySelector("#message").value = real_msg
            document.querySelector("#ui-btn-save").style.display = "block"
            document.querySelector("#status").innerText = "🔓 " + f_obj.name
        else: raise Exception()
    except:
        window.updateStatus('status_err')
        document.querySelector("#message").value = ""

async def save_action(e):
    k, m = document.querySelector("#key").value, document.querySelector("#message").value
    if not k: return
    try:
        header = "NO_TIMER"
        if document.querySelector("#timer-toggle").checked:
            minutes = int(document.querySelector("#expiry-time").value)
            header = f"EXPIRE:{int(time.time()) + (minutes * 60)}"
        
        signed_data = f"{header}|{m}{MAGIC_FOOTER}"
        s, _, sh, _ = get_crypto_tools(k)
        d = signed_data.encode('utf-8'); p = 16 - (len(d) % 16); d += bytes([p] * p)
        b64 = base64.b64encode(bytes([s[b ^ sh] for b in d])).decode('utf-8')
        
        try:
            writable = await window.currentFileHandle.createWritable()
            await writable.write(b64); await writable.close()
            window.updateStatus('status_saved')
        except:
            await create_action(None)
            window.updateStatus('mobile_save')
    except:
        window.updateStatus('status_err')
</script>
</body>
</html>
